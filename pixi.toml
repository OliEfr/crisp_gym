[workspace]
preview = ["pixi-build"]
authors = [
    "Maximilian Dösch <doesch.maximilian@gmail.com>",
    "Daniel San José Pro <42489409+danielsanjosepro@users.noreply.github.com>"
]
channels = ["https://prefix.dev/conda-forge"]
name = "crisp_gym"
platforms = ["linux-64"]

[activation]
scripts = [
    "scripts/set_env.sh",
]

[dependencies]
compilers = "*"
cmake = "*"
pkg-config = "*"
make = "*"
ninja = "*"
typing_inspect = ">=0.9.0,<0.10"
libstdcxx-ng = ">=12.2.0"
numpy = "<=2.3"
packaging = ">=24.2,<26.0"
setuptools = ">=71,<81"


[target.linux.dependencies]
libgl-devel = "*"

[environments]
dev = { features = ["py311", "dev"] }
humble = { features = ["py311", "humble"] }
humble-lerobot = { features = ["py311", "humble", "lerobot", "dev"] }



























humble-lerobot-pi05 = { features = ["py311", "humble", "lerobot-pi05"] }
humble-lerobot-lam = { features = ["py311", "humble", "lerobot-lam", "dev"] }
lerobot = { features = ["py311", "lerobot"] }
jazzy = { features = ["py311", "jazzy"] }
jazzy-lerobot = { features = ["py312", "jazzy", "lerobot-jazzy", "dev"] }
kilted-lerobot = { features = ["py312", "kilted", "lerobot-kilted", "dev"] }

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.kilted]
channels = ["https://prefix.dev/conda-forge", "https://prefix.dev/robostack-kilted"]

[feature.kilted.dependencies]
pip = "*"
packaging = ">=24.2,<26.0"
setuptools = ">=71,<81"
ros2-distro-mutex = { version = "0.13.*", build = "kilted_*" }
ros-kilted-desktop = "*"
colcon-common-extensions = "*"
ros-kilted-ros2-control = "*"
ros-kilted-ros2-controllers = "*"
rosdep = "*"
ros-kilted-rmw-cyclonedds-cpp = "*"
ros-kilted-image-transport-plugins = "*"

[feature.dev.pypi-dependencies]
pre-commit = "*"
ruff = "*"
debugpy = ">=1.8.14,<2"
pudb = ">=2025.1.3, <2026"

[feature.lerobot.dependencies]
pynput = "*"
rerun-sdk = "=0.22.1"

[feature.lerobot-jazzy.dependencies]
pynput = "*"
numpy = ">=2.0.0,<2.3.0"


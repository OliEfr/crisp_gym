gripper_mode: "absolute_continuous"

cartesian_control_param_config: "/home/maxchr/repos/crisp_gym/crisp_gym/config/envs/clipped_cartisian_impedance_oliver.yaml"  
joint_control_param_config: "/home/maxchr/repos/crisp_gym/crisp_gym/config/envs/joint_control_oliver.yaml"      

robot_config:
  robot_type: "franka"
  time_to_home: 2.0
  publish_frequency: 50.0
  home_config:
    - -1.73960110e-02
    - 9.55319758e-02
    - 8.09703053e-04
    - -1.94272034
    - -4.01435784e-03
    - 2.06584183
    - 7.97426445e-01

gripper_config:
  from_yaml: "grippers/gripper_left_v3_yi.yaml"

camera_configs:
  - camera_name: "primary"
    camera_frame: "primary_link"
    resolution: [256, 256]
    camera_color_image_topic: "right_down_third_person_camera/color/image_raw"
    camera_color_info_topic: "right_down_third_person_camera/color/camera_info"
  - camera_name: "wrist"
    camera_frame: "wrist_link" 
    resolution: [256, 256]
    camera_color_image_topic: "left_wrist_camera/color/image_rect_raw"
    camera_color_info_topic: "left_wrist_camera/color/camera_info"

sensor_configs:
  - name: "bota_ft_sensor"
    sensor_type: "force_torque"
    data_topic: "/bota_ft_sensor/wrench"
    shape: [6,]
    reset_service: "/bota_ft_sensor/tare"

control_frequency: 15.0



